services:
  db:
    image: postgres:16-alpine
    container_name: ercsocket-db
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ercsocket}
      POSTGRES_USER: ${DB_USERNAME:-ercsocket}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ercsocket}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ercsocket} -d ${DB_DATABASE:-ercsocket}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ercsocket:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ercsocket
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8087:8087"
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:-itsupport@erceyecare.com}
      ADMIN_SOCKET: wss://monitor.erclens.com
      DEVICE_ID: ${DEVICE_ID:-asxc1234567ERC004145665551wesASDVB123f0}
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-ercsocket}
      DB_USERNAME: ${DB_USERNAME:-ercsocket}
      DB_PASSWORD: ${DB_PASSWORD:-ercsocket}
    volumes:
      - ./data:/var/www/html/data
      - ./clients.db:/var/www/html/clients.db
    restart: unless-stopped

volumes:
  pgdata:
